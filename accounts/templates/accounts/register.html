
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Register - Skill Swap</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <h1>Skill Swap</h1>
    <p>Connect with people. Share skills. Learn together.</p>

    <hr>

    <h2>Create Your Account</h2>
    <p>Join our community and start exchanging skills.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Log in here</a>
    </p>

</body>
</html>
